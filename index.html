  <label class="row"><input type="checkbox" id="sMotion"> Reduce visual effects</label>
  <label>Card size <select id="sSize"><option value="s">Compact</option><option value="m">Standard</option><option value="l">Large</option></select></label>
  <label>Avatar shape <select id="sShape"></select></label>
  <label>Default avatar family <select id="sFam"></select></label>
  <label class="row"><input type="checkbox" id="sContrast"> High contrast text</label>
  <div class="acts"><button type="button" id="clrHist">Clear search history</button><button type="button" id="rstSet">Reset appearance</button><button class="pri" value="x">Close</button></div>
